[package]
name = "offsales-pos"
version = "0.2.0"
edition = "2021"
description = "Offline point of sale for Off Sales"

[[bin]]
name = "offsales-pos"
path = "src/main.rs"

[features]
# Development only: POS_DEV_USER=<name> signs that person in without a PIN;
# POS_SERVER_LOOPBACK keeps server mode on 127.0.0.1. Never in shipped builds.
dev-tools = []

[dependencies]
eframe = "0.31"
egui_extras = "0.31"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
directories = "6"
anyhow = "1"
self_update = { version = "0.42", default-features = false, features = ["rustls", "archive-zip", "compression-zip-deflate"] }
semver = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
# LAN server/till sync
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-no-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }

# PIN hashing is deliberately slow; keep it fast enough in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
